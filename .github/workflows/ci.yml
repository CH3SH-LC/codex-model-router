name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned dependencies
        run: |
          python -m pip install --only-binary=:all: -r requirements.lock.txt
      - name: Offline router and installer tests
        run: python -m unittest discover -s tests -v
      - name: Public source checks
        run: python scripts/check_public.py
      - name: Build verified source package
        run: python scripts/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: codex-model-router-source
          path: dist/*
